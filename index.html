html,body{margin:0;width:100%;height:100%;font:15px Arial,sans-serif}#panorama{width:100%;height:100vh}
#controls{position:absolute;top:10px;left:10px;z-index:20;max-width:min(360px,calc(100vw - 32px));background:rgba(15,24,32,.88);color:white;padding:12px;border-radius:10px;box-sizing:border-box}
#controls h1{font-size:16px;margin:0 0 10px}#controls label{font-size:12px;display:block;margin:8px 0 4px}#controls select{width:100%;padding:8px;border-radius:4px;border:0;background:white;color:#18232c}
#controls button{padding:7px 10px;margin-top:9px;border:0;border-radius:4px;cursor:pointer}#editorPane{margin-top:8px;border-top:1px solid #667;padding-top:5px}#clickCoords{font-size:12px;line-height:1.5;overflow-wrap:anywhere}
#controls.collapsed #bodyControls{display:none}#toggleControls{float:right;margin:0!important}
/* Standalone hotspot icons; the CSS class controls the appearance. */
.pnlm-hotspot.tour-nav, .pnlm-hotspot.tour-turn, .pnlm-hotspot.tour-info{width:35px;height:35px;border-radius:50%;background:rgba(11,76,98,.96);box-shadow:0 2px 6px #0008;cursor:pointer;border:2px solid white;box-sizing:border-box}
.pnlm-hotspot.tour-turn{background:#73501e}.pnlm-hotspot.tour-info{background:#205c88}
.pnlm-hotspot.tour-nav::before,.pnlm-hotspot.tour-turn::before,.pnlm-hotspot.tour-info::before{content:'➜';position:absolute;inset:0;display:grid;place-items:center;font-size:23px;color:white;font-weight:bold;transform:rotate(var(--turn, -90deg))}
.pnlm-hotspot.tour-turn::before{content:'⤾';font-size:29px;transform:none}.pnlm-hotspot.tour-info::before{content:'i';font-family:Georgia,serif;font-size:23px;transform:none}
.pnlm-hotspot.tour-nav.rot0{--turn:-90deg}.pnlm-hotspot.tour-nav.rot45{--turn:-45deg}.pnlm-hotspot.tour-nav.rot90{--turn:0deg}.pnlm-hotspot.tour-nav.rot270{--turn:180deg}.pnlm-hotspot.tour-nav.rot315{--turn:225deg}

#navPad{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:18;pointer-events:none}
#navPad .pad{position:relative;width:220px;height:170px}
#navPad button{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(11,76,98,.9);color:white;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:28px;font-weight:bold;cursor:pointer;display:none}
#navPad button.show{display:grid;place-items:center}
#navPad button:hover{background:rgba(21,111,141,.95)}
#navPad button.turn{background:rgba(115,80,30,.92)}
#navPad button.turn:hover{background:rgba(145,102,38,.95)}
#navForward{top:0;left:50%;transform:translateX(-50%)}
#navLeft{top:58px;left:24px}
#navRight{top:58px;right:24px}
#navTurn{bottom:0;left:50%;transform:translateX(-50%)}
#navPadLabel{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);padding:5px 10px;border-radius:999px;background:rgba(15,24,32,.82);color:#fff;font-size:12px;white-space:nowrap;display:none}
#navPadLabel.show{display:block}
@media(max-width:600px){#controls{max-height:50vh;overflow:auto}#controls h1{font-size:14px}#navPad .pad{width:200px;height:156px}#navPad button{width:52px;height:52px;font-size:26px}#navLeft{left:18px}#navRight{right:18px}}

/* Screen-anchored route controls: never rotate out of the panorama. */
#routeBar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:40;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;padding:10px 12px;border-radius:12px;background:rgba(15,24,32,.92);color:white;box-shadow:0 3px 14px #0007}
#routeBarTitle{font-weight:bold;font-size:12px;margin-bottom:6px;text-align:center}
#routeButtons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#routeButtons button{background:#126b83;color:white;border:1px solid #a9d7e4;border-radius:8px;padding:10px 14px;min-height:44px;font:600 14px Arial,sans-serif;cursor:pointer}
#routeButtons button:hover,#routeButtons button:focus-visible{background:#208aa5;outline:2px solid white;outline-offset:2px}
#routeButtons button.turn-button{background:#73501e;border-color:#f0d9b3}
@media(max-width:600px){#routeBar{bottom:8px;width:calc(100vw - 16px);padding:8px}#routeButtons{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:2px 2px 6px}#routeButtons button{flex:none;font-size:13px}}

}
function clearNavButtons(){
  [navForward,navLeft,navRight,navTurn].forEach(btn=>{btn.classList.remove('show'); btn.onclick=null; btn.removeAttribute('data-target'); btn.dataset.label='';});
  navPadLabel.classList.remove('show');
}
function assignNavButton(button, item){
  if (!button || !item) return;
  const label = routeLabel(item);
  button.classList.add('show');
  button.title = label;
  button.setAttribute('aria-label', label);
  button.dataset.label = label;
  button.onclick = () => activateView(item.target, true);
}
function renderNavPad(){
  clearNavButtons();
  const preset = activePreset || sceneDefaultPreset[viewer.getScene()] || 's1start';
  const scene = views[preset]?.scene || viewer.getScene();
  const sceneNum = scene ? scene.replace('scene','') : '';
  const sceneLinks = linksBySource[preset] || [];
  const slotItems = {};
  for (const item of sceneLinks) {
    const slot = slotByLinkId[item.id] || 'forward';
    if (!slotItems[slot]) slotItems[slot] = item;
  }
  assignNavButton(navForward, slotItems.forward);
  assignNavButton(navLeft, slotItems.left);
  assignNavButton(navRight, slotItems.right);
  const turnTarget = turnTargets[preset];
  if (turnTarget) {
    navTurn.classList.add('show');
    navTurn.title = 'Turn around';
    navTurn.setAttribute('aria-label', 'Turn around');
    navTurn.dataset.label = 'Turn around';
    navTurn.onclick = () => activateView(turnTarget, true);
  }
  navPadLabel.textContent = `Walking navigation — Scene ${sceneNum}`;
  navPadLabel.classList.add('show');
}
function activateView(id, animated = false) {
  const v = views[id];
  if (!v) return;
  activePreset = id;
  viewSelect.value = id;
  equipmentSelect.value = '';
  const done = () => renderNavPad();
  if (viewer.getScene() === v.scene) {
    viewer.lookAt(v.pitch, v.yaw, v.hfov, animated ? 1100 : 0);
    done();
  } else {
    viewer.loadScene(v.scene, v.pitch, v.yaw, v.hfov);
    // scenechange event will also fire, but render once immediately for responsiveness
    setTimeout(done, 50);
  }
}
viewSelect.addEventListener('change', () => activateView(viewSelect.value));
document.getElementById('start').addEventListener('click', () => activateView('s1start', true));
equipmentSelect.addEventListener('change', () => {
  if (equipmentSelect.value === '') return;
  const e = equipment[Number(equipmentSelect.value)];
  // Keep navigation visible. If switching scenes, choose the scene's default navigation context.
  if (viewer.getScene() !== e.scene) activePreset = sceneDefaultPreset[e.scene] || activePreset;
  if (activePreset) viewSelect.value = activePreset;
  const done = () => renderNavPad();
  if (viewer.getScene() === e.scene) {
    viewer.lookAt(e.viewPitch, e.viewYaw, e.hfov, 1100);
    done();
  } else {
    viewer.loadScene(e.scene, e.viewPitch, e.viewYaw, e.hfov);
    setTimeout(done, 50);
  }
});
viewer.on('scenechange', renderNavPad);
viewer.on('mousedown',ev=>{
 const result=viewer.mouseEventToCoords(ev);
 if(!result)return;
 const [p,y]=result;
 document.getElementById('clickCoords').textContent=`Scene ${viewer.getScene().replace('scene','')} | arrow Pitch: ${p.toFixed(5)}, Yaw: ${y.toFixed(5)}`;
});
const controls=document.getElementById('controls');
document.getElementById('toggleControls').addEventListener('click',()=>{const hide=controls.classList.toggle('collapsed');document.getElementById('toggleControls').textContent=hide?'Show':'Hide'});
renderNavPad();
</script></body></html>
