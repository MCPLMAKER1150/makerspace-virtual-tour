html,body{margin:0;width:100%;height:100%;font:15px Arial,sans-serif}#panorama{width:100%;height:100vh}

#controls h1{font-size:16px;margin:0 0 10px}#controls label{font-size:12px;display:block;margin:8px 0 4px}#controls select{width:100%;padding:8px;border-radius:4px;border:0;background:white;color:#18232c}
#controls button{padding:7px 10px;margin-top:9px;border:0;border-radius:4px;cursor:pointer}#editorPane{margin-top:8px;border-top:1px solid #667;padding-top:5px}#clickCoords{font-size:12px;line-height:1.5;overflow-wrap:anywhere}
#controls.collapsed #bodyControls{display:none}#toggleControls{float:right;margin:0!important}
/* Standalone hotspot icons; the CSS class controls the appearance. */
.pnlm-hotspot.tour-nav, .pnlm-hotspot.tour-turn, .pnlm-hotspot.tour-info{width:35px;height:35px;border-radius:50%;background:rgba(11,76,98,.96);box-shadow:0 2px 6px #0008;cursor:pointer;border:2px solid white;box-sizing:border-box}
.pnlm-hotspot.tour-turn{background:#73501e}.pnlm-hotspot.tour-info{background:#205c88}
.pnlm-hotspot.tour-nav::before,.pnlm-hotspot.tour-turn::before,.pnlm-hotspot.tour-info::before{content:'➜';position:absolute;inset:0;display:grid;place-items:center;font-size:23px;color:white;font-weight:bold;transform:rotate(var(--turn, -90deg))}
.pnlm-hotspot.tour-turn::before{content:'⤾';font-size:29px;transform:none}.pnlm-hotspot.tour-info::before{content:'i';font-family:Georgia,serif;font-size:23px;transform:none}
.pnlm-hotspot.tour-nav.rot0{--turn:-90deg}.pnlm-hotspot.tour-nav.rot45{--turn:-45deg}.pnlm-hotspot.tour-nav.rot90{--turn:0deg}.pnlm-hotspot.tour-nav.rot270{--turn:180deg}.pnlm-hotspot.tour-nav.rot315{--turn:225deg}
@media(max-width:600px){#controls{max-height:50vh;overflow:auto}#controls h1{font-size:14px}}

// Pannellum hotspots are scene-level, but our navigation arrows belong to a specific arrival view.
// Remove / add the appropriate set each time a saved view is selected.
function updateNavigation(){
 for(const item of links){try{viewer.removeHotSpot(item.id,views[item.source].scene)}catch(e){}}
 for(const item of links.filter(x=>x.source===activePreset)){
   const destination=views[item.target];
   const isTurn=item.kind==='turn';
   const spot={id:item.id,pitch:item.pitch,yaw:item.yaw,type:'info',cssClass:isTurn?'tour-turn':`tour-nav rot${item.rotation}`,text:isTurn?'Turn around':`Move to ${destination.scene.replace('scene','Scene ')}`,
       clickHandlerFunc:()=>activateView(item.target,true)};
   viewer.addHotSpot(spot,views[item.source].scene);
 }
}
function activateView(id,animated=false){
 const v=views[id];if(!v)return;
 activePreset=id;viewSelect.value=id;equipmentSelect.value='';
 // Set active view before loading scene; scenechange below can run during load.
 if(viewer.getScene()===v.scene)viewer.lookAt(v.pitch,v.yaw,v.hfov,animated?1100:0);
 else viewer.loadScene(v.scene,v.pitch,v.yaw,v.hfov);
 updateNavigation();
}
viewSelect.addEventListener('change',()=>activateView(viewSelect.value));
document.getElementById('start').addEventListener('click',()=>activateView('s1start',true));
equipmentSelect.addEventListener('change',()=>{
 if(equipmentSelect.value==='')return;
 const e=equipment[Number(equipmentSelect.value)];
 // hide route arrows on equipment-focused views to avoid suggesting the camera moved to another location
 activePreset='';
 updateNavigation();
 if(viewer.getScene()===e.scene)viewer.lookAt(e.viewPitch,e.viewYaw,e.hfov,1100);
 else viewer.loadScene(e.scene,e.viewPitch,e.viewYaw,e.hfov);
 viewSelect.value='';
});

 const result=viewer.mouseEventToCoords(ev);
 if(!result)return;
 const [p,y]=result;
 document.getElementById('clickCoords').textContent=`Scene ${viewer.getScene().replace('scene','')} | arrow Pitch: ${p.toFixed(5)}, Yaw: ${y.toFixed(5)}`;
});
const controls=document.getElementById('controls');
document.getElementById('toggleControls').addEventListener('click',()=>{const hide=controls.classList.toggle('collapsed');document.getElementById('toggleControls').textContent=hide?'Show':'Hide'});
