<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
       content="width=device-width, initial-scale=1.0">
<title>Makerspace Virtual Tour</title>
<link rel="stylesheet"
   href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
<script
   src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
</script>
<style>
   html, body {
     margin: 0;
     width: 100%;
     height: 100%;
     font-family: Arial, sans-serif;
   }
   #panorama {
     width: 100%;
     height: 100vh;
   }
   #scene-menu {
     position: absolute;
     top: 15px;
     left: 15px;
     z-index: 10;
     padding: 10px;
     background: rgba(0, 0, 0, 0.75);
     color: white;
     border-radius: 6px;
   }
   #scene-select {
     padding: 7px;
     font-size: 14px;
     max-width: 220px;
   }
</style>
</head>
<body>
<div id="panorama"
      aria-label="Interactive makerspace tour">
</div>
<div id="scene-menu">
<label for="scene-select">Location:</label>
<select id="scene-select">
<option value="scene1">Scene 1</option>
<option value="scene2">Scene 2</option>
<option value="scene3">Scene 3</option>
<option value="scene4">Scene 4</option>
<option value="scene5">Scene 5</option>
<option value="scene6">Scene 6</option>
<option value="scene7">Scene 7</option>
<option value="scene8">Scene 8</option>
<option value="scene9">Scene 9</option>
</select>
</div>
<script>
   const viewer = pannellum.viewer('panorama', {
     default: {
       firstScene: "scene1",
       autoLoad: true,
       sceneFadeDuration: 800
     },
     scenes: {
       scene1: {
         type: "equirectangular",
         panorama: "R0010017E.JPG",
         title: "Scene 1"
       },
       scene2: {
         type: "equirectangular",
         panorama: "R0010018E.JPG",
         title: "Scene 2"
       },
       scene3: {
         type: "equirectangular",
         panorama: "R0010019E.JPG",
         title: "Scene 3"
       },
       scene4: {
         type: "equirectangular",
         panorama: "R0010020E.JPG",
         title: "Scene 4"
       },
       scene5: {
         type: "equirectangular",
         panorama: "R0010021E.JPG",
         title: "Scene 5"
       },
       scene6: {
         type: "equirectangular",
         panorama: "R0010022E.JPG",
         title: "Scene 6"
       },
       scene7: {
         type: "equirectangular",
         panorama: "R0010023E.JPG",
         title: "Scene 7"
       },
       scene8: {
         type: "equirectangular",
         panorama: "R0010024E.JPG",
         title: "Scene 8"
       },
       scene9: {
         type: "equirectangular",
         panorama: "R0010025E.JPG",
         title: "Scene 9"
       }
     }
   });
   const sceneSelect =
     document.getElementById('scene-select');
   sceneSelect.addEventListener('change', function() {
     viewer.loadScene(this.value);
   });
   viewer.on('scenechange', function(sceneId) {
     sceneSelect.value = sceneId;
   });
</script>
</body>
</html>
