*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font:15px Arial,sans-serif}
#panorama{width:100%;height:100dvh}
#controls{position:absolute;top:12px;left:12px;z-index:30;width:min(340px,calc(100vw - 24px));padding:12px;background:rgba(15,24,32,.9);color:#fff;border-radius:12px}
#controls h1{font-size:16px;margin:0 0 8px}
#controls label{font-size:12px;display:block;margin:8px 0 4px}
#controls select{display:block;width:100%;padding:9px;border:0;border-radius:5px;background:#fff;color:#152832}
#controls button{border:0;border-radius:6px;padding:8px 12px;margin-top:9px;cursor:pointer}
#toggleControls{float:right;margin:0!important}
#controls.collapsed #bodyControls{display:none}
#editorPane{margin-top:9px;padding-top:7px;border-top:1px solid #667}
#clickCoords{font-size:12px;overflow-wrap:anywhere}
#navPanel{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:25;background:rgba(15,24,32,.9);border:1px solid rgba(255,255,255,.24);color:white;border-radius:14px;padding:10px;box-shadow:0 4px 18px #0007;max-width:calc(100vw - 20px)}
.navTitle{font-size:12px;text-align:center;margin:0 0 8px}
.navHelp{font-size:11px;color:#d4e0e6;text-align:center;margin:6px 0 0}
#turnButton{border:1px solid #e4d1a3;border-radius:8px;background:#76552a;color:white;padding:7px 12px;cursor:pointer;font-weight:bold}
button:focus-visible{outline:3px solid #ffda68;outline-offset:2px}
@media(max-width:600px){#controls{max-height:44dvh;overflow:auto}#navPanel{bottom:6px;padding:8px}#controls h1{font-size:14px}}
</style><style>
#navPanel{width:322px}
#mapBoard{position:relative;width:298px;height:258px;margin:auto;border:1px solid #668995;border-radius:10px;background:linear-gradient(#1b3845,#122a35)}
#mapLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mapNodes{position:absolute;inset:0}
.mapNode{position:absolute;transform:translate(-50%,-50%);border:1px solid #a8c7d1;border-radius:50%;width:35px;height:35px;background:#254a5b;color:#fff;font-weight:bold;cursor:pointer}
.mapNode.current{background:#e3f5fa;color:#12313d;border:3px solid #48c3e0}
.mapNode.available{background:#167e94;border:2px solid #fff}
.mapNode:disabled{cursor:default;opacity:.55}
#mapLegend{text-align:center;font-size:11px;color:#d1e4eb;margin:7px 0}
#mapTurn{text-align:center}
@media(max-width:600px){#navPanel{width:278px}#mapBoard{width:254px;height:220px} .mapNode{width:32px;height:32px}}
</style>

    const old=options.get(destScene);
    // Prefer a link recorded for the actual arrival view, but keep every unique exit visible.
    if(!old || (link.source===activePreset && old.source!==activePreset))options.set(destScene,link);

function goToView(key, animate=true){
  const v=views[key];if(!v)return;

  else viewer.loadScene(v.scene,v.pitch,v.yaw,v.hfov);
  refreshNav();
}

  const e=equipment[index];if(!e)return;
  if(currentScene()!==e.scene)activePreset=sceneDefaults[e.scene];

  refreshNav();
}
function turnAround(){
  const alt=turnTargets[activePreset]||sceneDefaults[currentScene()];
  if(alt && views[alt].scene===currentScene())goToView(alt);
  else viewer.lookAt(viewer.getPitch(),viewer.getYaw()+180,viewer.getHfov(),1000);
}

  const key=[a,b].sort().join(':');
  if(a!==b && !edgeKeys.has(key)){edgeKeys.add(key);edges.push([a,b])}
});
const NS='http://www.w3.org/2000/svg';
for(const [a,b] of edges){
  const line=document.createElementNS(NS,'line');
  line.setAttribute('x1',positions[a][0]);line.setAttribute('y1',positions[a][1]);
  line.setAttribute('x2',positions[b][0]);line.setAttribute('y2',positions[b][1]);
  line.setAttribute('stroke','#7797a4');line.setAttribute('stroke-width','2');line.setAttribute('opacity','.7');
  mapLines.append(line);
}
const mapButtons={};
for(let n=1;n<=9;n++){
  const id=`scene${n}`,btn=document.createElement('button');
  btn.className='mapNode';btn.type='button';btn.textContent=String(n);
  btn.style.left=(positions[id][0]/298*100)+'%';btn.style.top=(positions[id][1]/258*100)+'%';
  btn.setAttribute('aria-label',`Scene ${n}`);mapNodes.append(btn);mapButtons[id]=btn;
}
function refreshNav(){
  const scene=currentScene(), routes=chooseRoutes();
  const next=new Map(routes.map(route=>[views[route.target].scene,route]));
  for (let n=1;n<=9;n++){
    const id=`scene${n}`,button=mapButtons[id];
    const route=next.get(id);
    button.classList.toggle('current',id===scene);
    button.classList.toggle('available',Boolean(route));
    button.disabled=!route;
    button.title=id===scene?'Current scene':route?`Go to Scene ${n}`:`Scene ${n} is not directly connected`;
    button.onclick=route?()=>goToView(route.target):null;
  }
}
viewer.on('scenechange',refreshNav);
refreshNav();
</script></body></html>
